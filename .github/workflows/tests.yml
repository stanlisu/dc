name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install pandas numpy pyarrow joblib lightgbm xgboost scikit-learn statsmodels
          pip install -e agamotto_pkg/ \
                      orb_pkg/ \
                      scepter_pkg/ \
                      mjolnir_pkg/ \
                      vomir_pkg/ \
                      vibranium_pkg/ \
                      valkyrie_pkg/ \
                      aether_pkg/ \
                      stormbreaker_pkg/

      - name: Run tests
        run: pytest agamotto_pkg/tests/ -v --tb=short
