name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # MUST run BEFORE `pip install -e`. The vendored <pkg>/_obf/ copies are
      # derived from obfuscation/ and gitignored (.gitignore:11), so they do
      # not exist in a fresh checkout. setuptools records an editable
      # package's subpackages at INSTALL time, so a subpackage created later
      # is never mapped and `import <pkg>._obf` fails at runtime. conftest.py
      # regenerates them too, but by then the mapping is already fixed —
      # which is exactly how `scepter._obf` failed the moment CI stopped
      # running agamotto alone. Both scripts are stdlib-only.
      - name: Generate vendored obfuscation codec
        run: |
          python obfuscation/build_map.py
          python obfuscation/sync_vendor.py

      # TA-Lib is NOT optional for this suite, despite features.py wrapping its
      # import in `except ImportError`. That fallback (`_numpy_indicators`) stubs
      # adx/dx/cci/willr/stoch/sar/obv/ad/mfi/plus_di/minus_di/cmo to NaN,
      # hand-rolls a non-Wilder RSI and emits a MACD with no warmup NaN — so a
      # CI without TA-Lib does not skip those features, it computes DIFFERENT
      # MATH and reports failures that are pure environment.
      #
      # That is not hypothetical: `3fe8e57` added test_scale_free_levels.py,
      # whose columns only exist on the TA-Lib path, and CI has been RED on
      # every push since 2026-08-06 11:40 with "TA-Lib error for BTCUSDT: No
      # module named 'talib'". Because deploy.yml gates on
      # `workflow_run.conclusion == 'success'`, Deploy was SKIPPED — never
      # attempted — for every commit after that, stranding seven of them
      # undeployed. The C++ side has always linked libta-lib unconditionally
      # (sentinel_core/CMakeLists.txt raises FATAL_ERROR without it); only the
      # Python reference was allowed to degrade quietly.
      #
      # Version is pinned to the SAME source of truth the C++ builds against —
      # sentinel_core/Dockerfile.build's `ARG TALIB_VERSION` — and read from
      # that file rather than duplicated here, so the two cannot drift. The
      # post-install assert makes a partial build fail here instead of
      # surfacing as a mysterious numeric mismatch later.
      - name: Install TA-Lib (C library + python bindings)
        run: |
          set -euo pipefail
          TALIB_VERSION="$(sed -n 's/^ARG TALIB_VERSION=\(.*\)$/\1/p' sentinel_core/Dockerfile.build)"
          [ -n "$TALIB_VERSION" ] || { echo "ERROR: cannot read ARG TALIB_VERSION from sentinel_core/Dockerfile.build — refusing to guess the pin the C++ was built against"; exit 1; }
          echo "Building TA-Lib ${TALIB_VERSION} (pin read from Dockerfile.build)"
          cd /tmp
          wget -q "https://github.com/TA-Lib/ta-lib/releases/download/v${TALIB_VERSION}/ta-lib-${TALIB_VERSION}-src.tar.gz"
          tar xzf "ta-lib-${TALIB_VERSION}-src.tar.gz"
          cd "ta-lib-${TALIB_VERSION}"
          ./configure --prefix=/usr >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install
          sudo ldconfig
          cd / && rm -rf "/tmp/ta-lib-${TALIB_VERSION}"*
          # --no-binary is LOad-BEARING, not a preference. A plain
          # `pip install TA-Lib` grabs the manylinux wheel, which BUNDLES its own
          # C library and ignores the one just built into /usr — the first
          # attempt at this step installed wrapper 0.7.1 carrying TA-Lib 0.7.1
          # and the source build below it was dead weight. Forcing a source
          # build makes the wrapper link the system library, i.e. the pinned
          # version. The wrapper is held to the 0.6 series because a 0.7 wrapper
          # expects a 0.7 C API.
          #
          # 0.6.4 is what PRODUCTION runs — verified 2026-08-07 on both hydra
          # and shield: `talib.__ta_version__` -> "0.6.4 (Jul 30 2025)". It is
          # also the sentinel_core pin, so CI, prod and the C++ now agree.
          pip install --no-binary ta-lib 'TA-Lib>=0.6,<0.7'
          # Assert the binding really loaded and links the pinned version. Fail
          # here, not 500 lines into a numeric diff. Mirrors the same check
          # Dockerfile.build:35-36 runs against the C++ build. This assert has
          # already earned its keep — it is what caught the bundled-wheel case.
          TALIB_VERSION="$TALIB_VERSION" python -c 'import os, talib; v = talib.__ta_version__; v = v.decode() if isinstance(v, bytes) else str(v); want = os.environ["TALIB_VERSION"]; assert want in v, f"FAIL: expected TA-Lib {want}, got {v}"; print(f"TALIB VERSION OK: {v}")'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          # pandas PINNED 2026-08-04 to the version prod actually runs
          # (shield/hydra 3.0.2, shield2 3.0.3). Unpinned, CI resolved to
          # whatever was newest (3.0.5) while marvel/environment.yml still
          # declares 2.3.3 — three different pandas across dev, CI and prod.
          #
          # Pinning is right, but the root cause it was first blamed for was
          # WRONG: mjolnir's rolling-quantile warmup bug was NOT a pandas-3
          # regression. `_window_days` read raw `.asi8` ints as nanoseconds;
          # `.asi8` is in the index's OWN unit, and production bar parquets
          # read back as datetime64[us, UTC] (verified on shield2), so the
          # trailing window collapsed to 1 day on EVERY machine and BOTH
          # pandas majors. pandas 3 only made [us] the pd.date_range default,
          # which is why the synthetic test grid finally tripped over it. The
          # regression tests now parametrize over index unit + tz so they fail
          # on 2.x too — see mjolnir_pkg/tests/test_rolling_quantile_atoms.py
          # (TestWindowDaysUnitProof).
          #
          # STILL DIVERGENT: marvel/environment.yml pins 2.3.3 while this and
          # prod are on 3.0.x. Reconcile — a version split is how this hid.
          pip install 'pandas==3.0.3' numpy pyarrow joblib lightgbm xgboost scikit-learn statsmodels
          # -e on EVERY package, not just the first. Until 2026-08-04 this read
          # `pip install -e agamotto_pkg/ \ orb_pkg/ \ ...`, where -e binds only
          # to agamotto: the other eight were installed NON-editable, i.e.
          # copied into site-packages. None of their setup.py files declare
          # package_data, so the vendored _obf/map.json (a DATA file) never got
          # copied and `Codec()` died on a missing map at import time. It went
          # unnoticed because CI only ever ran agamotto's tests — the one
          # package that was editable and therefore read from the source tree.
          # build_distribution.sh patches package_data in for the pyarmor build,
          # which is why real deploys are unaffected.
          pip install -e agamotto_pkg/ \
                      -e orb_pkg/ \
                      -e scepter_pkg/ \
                      -e mjolnir_pkg/ \
                      -e vomir_pkg/ \
                      -e vibranium_pkg/ \
                      -e valkyrie_pkg/ \
                      -e aether_pkg/ \
                      -e stormbreaker_pkg/

      - name: Run tests
        # Run the WHOLE suite, not just agamotto_pkg/tests/. Until 2026-08-04
        # this line named agamotto only, so the mjolnir, stormbreaker, orb,
        # scepter, aether, vomir, valkyrie and vibranium suites were never
        # exercised by CI even though every one of those packages is pip
        # installed above — dc #29 (the missing-column raise) shipped with its
        # regression tests invisible to CI.
        #
        # Invoked from the repo root on purpose: it picks up new packages
        # automatically, so adding one can never silently leave it untested.
        # conftest.py regenerates the vendored _obf codec first (it is derived
        # and gitignored); sentinel_core/tests/*.py are parity DRIVERS, not
        # test_*.py, so pytest does not collect them and they still need their
        # compiled binaries to run.
        run: pytest -v --tb=short
