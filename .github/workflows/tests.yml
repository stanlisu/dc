name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install pandas numpy pyarrow joblib lightgbm xgboost scikit-learn statsmodels
          pip install -e agamotto_pkg/ \
                      orb_pkg/ \
                      scepter_pkg/ \
                      mjolnir_pkg/ \
                      vomir_pkg/ \
                      vibranium_pkg/ \
                      valkyrie_pkg/ \
                      aether_pkg/ \
                      stormbreaker_pkg/

      - name: Run tests
        # Run the WHOLE suite, not just agamotto_pkg/tests/. Until 2026-08-04
        # this line named agamotto only, so the mjolnir, stormbreaker, orb,
        # scepter, aether, vomir, valkyrie and vibranium suites were never
        # exercised by CI even though every one of those packages is pip
        # installed above — dc #29 (the missing-column raise) shipped with its
        # regression tests invisible to CI.
        #
        # Invoked from the repo root on purpose: it picks up new packages
        # automatically, so adding one can never silently leave it untested.
        # conftest.py regenerates the vendored _obf codec first (it is derived
        # and gitignored); sentinel_core/tests/*.py are parity DRIVERS, not
        # test_*.py, so pytest does not collect them and they still need their
        # compiled binaries to run.
        run: pytest -v --tb=short
