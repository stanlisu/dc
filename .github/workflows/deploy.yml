name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyArmor
        run: pip install pyarmor

      - name: Build obfuscated packages
        run: |
          # _obf/ (vendored obfuscation codec + map.json) is gitignored — a
          # fresh checkout has none. Regenerate before building, exactly like
          # build_distribution.sh, or the shipped packages crash on
          # `from .._obf.codec import default`.
          python obfuscation/build_map.py
          python obfuscation/sync_vendor.py
          ALGOS=(agamotto orb aether scepter mjolnir stormbreaker vibranium valkyrie vomir)
          for algo in "${ALGOS[@]}"; do
            echo "Building $algo..."
            build_dir="build_dist/${algo}_pkg"
            rm -rf "$build_dir"
            mkdir -p "$build_dir"
            pyarmor gen -O "$build_dir/src" -r "${algo}_pkg/src/$algo"
            # map.json is DATA — pyarmor gen only processes .py and drops it;
            # codec.py loads it from next to itself.
            if [ -f "${algo}_pkg/src/$algo/_obf/map.json" ]; then
              cp "${algo}_pkg/src/$algo/_obf/map.json" "$build_dir/src/$algo/_obf/map.json"
            fi
            cp "${algo}_pkg/setup.py" "$build_dir/"
            sed -i 's/python_requires=">=3.7",/python_requires=">=3.7", package_data={"": ["*.so", "*.dylib", "*.dll", "*.json"]}, zip_safe=False,/g' "$build_dir/setup.py"
            # if-form, not `[ -f ] && cp`: a missing optional file on the LAST
            # loop iteration made the step's exit status 1 and failed every
            # Deploy run at build time (vomir has neither file).
            if [ -f "${algo}_pkg/README.md" ]; then cp "${algo}_pkg/README.md" "$build_dir/"; fi
            if [ -f "${algo}_pkg/requirements.txt" ]; then cp "${algo}_pkg/requirements.txt" "$build_dir/"; fi
          done

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # `tr -d '\r'` matters: a key pasted from a CRLF clipboard, or through
          # an editor that rewrote line endings, keeps its \r and OpenSSH then
          # rejects the whole file with the opaque `error in libcrypto`.
          # printf '%s\n' (not echo) guarantees exactly one trailing newline,
          # which OpenSSH also requires.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # THE UNSET CASE, and why the old `-s` test could never catch it.
          # An unset secret expands to the empty string, and both `echo ""` and
          # `printf '%s\n' ""` still write ONE NEWLINE — a 1-byte file. `-s` only
          # asks "size > 0", so it passed on a file containing nothing but "\n".
          # The guard added specifically to catch run 30084051919's empty key was
          # therefore incapable of catching it, and stayed that way until
          # 2026-08-07, when `gh api repos/stanlisu/dc/actions/secrets` returned
          # `total_count: 0` — the secret had NEVER existed. Every "malformed
          # key" diagnosis before that, including TODO.md P7.1's, was inferred
          # from this guard passing and was wrong.
          #
          # Test the CONTENT, not the size: strip whitespace and require
          # something left.
          if [ -z "$(tr -d '[:space:]' < ~/.ssh/id_ed25519)" ]; then
            echo "::error::DEPLOY_SSH_KEY is UNSET or blank — the file contains only whitespace. This is NOT a malformed key and NOT a host problem. Create the secret: gh secret set DEPLOY_SSH_KEY --repo stanlisu/dc < /path/to/deploy_key  (and put the matching .pub in ~/.ssh/authorized_keys on 13.115.134.141 and 3.112.232.77)"
            exit 1
          fi
          # A NON-EMPTY key is not a VALID key, and only -s was ever checked. So
          # a malformed secret sailed through this step and died three steps
          # later as `Load key: error in libcrypto` / `Permission denied
          # (publickey)` addressed to a HOST — which reads like a server-side
          # authorized_keys problem. On 2026-08-07 that misdirection cost a
          # round trip: the key was re-pasted on hydra, but the secret lives in
          # THIS repo's Actions secrets and was never the host's to fix.
          #
          # ssh-keygen -y derives the public key from the private one, so it
          # actually parses the key material and fails HERE, naming the real
          # reason, on the step that owns the secret.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>~/.ssh/_keyerr; then
            echo "::error::DEPLOY_SSH_KEY is present but is NOT A VALID private key. This is a SECRET problem, not a host problem — do not touch authorized_keys on hydra/shield/shield2."
            echo "ssh-keygen said: $(cat ~/.ssh/_keyerr)"
            echo "First line of the decoded secret: $(head -1 ~/.ssh/id_ed25519)"
            echo "Line count: $(wc -l < ~/.ssh/id_ed25519)"
            echo "Re-paste the FULL private key including its BEGIN/END lines. Piping the file avoids the clipboard mangling that causes this:"
            echo "  gh secret set DEPLOY_SSH_KEY --repo stanlisu/dc < /path/to/deploy_key"
            rm -f ~/.ssh/_keyerr
            exit 1
          fi
          rm -f ~/.ssh/_keyerr
          echo "DEPLOY_SSH_KEY parsed OK: $(ssh-keygen -l -f ~/.ssh/id_ed25519)"
          # keyscans: shield (192.168.72.135) is LAN-only and unreachable from
          # GitHub-hosted runners; under bash -e a failed keyscan killed the
          # whole step. Tolerate per-host scan failures — unreachable hosts
          # fail later in their own (continue-on-error where appropriate) step.
          ssh-keyscan -T 10 -H 13.115.134.141 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -T 10 -H 192.168.72.135 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -T 10 -H 3.112.232.77 >> ~/.ssh/known_hosts 2>/dev/null || true

      # ONE deploy implementation for all three hosts.
      #
      # Until 2026-08-09 each host ran, inline:
      #     pip install -e A/ B/ C/ ...
      # where pip binds `-e` ONLY to the path that immediately follows it. So
      # agamotto was editable — its .pth points at the rsynced tree, and every
      # rsync took effect — while the other EIGHT were installed as physical
      # copies frozen in site-packages, which no later rsync can reach. Measured
      # on shield 2026-08-09: `mjolnir.core.ladder` imported a 2026-08-06
      # site-packages copy while the deployed tree held the 2026-08-08 build;
      # shield2 held a third version again. Every deploy since 2026-08-06 was a
      # silent no-op for 8 of 9 packages, and the job reported success.
      #
      # The identical defect was found and fixed in tests.yml on 2026-08-04
      # (see its `-e on EVERY package` comment) — deploy.yml was missed, which
      # is why this is now a shared script instead of three copied lines.
      #
      # `scripts/deploy_host.sh` does: pre-flight bot check -> rsync -> editable
      # install with -e on EVERY path -> verify identity+digest+import on the
      # host. It exits non-zero if the deployed bytes are not the imported
      # bytes, so a silent stale deploy fails the job.
      - name: Deploy to Hydra
        run: |
          bash scripts/deploy_host.sh \
            --host stan@13.115.134.141 \
            --python '$HOME/miniconda3/envs/py313/bin/python'

      - name: Deploy to Shield
        # Shield is a LAN address (192.168.72.135) — unreachable from
        # GitHub-hosted runners. Fail fast + continue so Shield2 still runs;
        # deploy Shield manually via build_distribution.sh until a
        # self-hosted/VPN runner exists. NOTE: this is why shield had drifted
        # furthest — CI has never once installed on it.
        continue-on-error: true
        run: |
          bash scripts/deploy_host.sh \
            --host stan@192.168.72.135 \
            --python '/opt/miniconda3/envs/py313/bin/python' \
            --ssh-opts '-o ConnectTimeout=15'

      - name: Deploy to Shield2
        run: |
          bash scripts/deploy_host.sh \
            --host stan@3.112.232.77 \
            --python '$HOME/miniconda3/envs/py313/bin/python'
